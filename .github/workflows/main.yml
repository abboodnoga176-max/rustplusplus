name: Direct SFTP Upload (Full Repo + node_modules)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Pozwala uruchomić ręcznie w zakładce Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Pobierz całe repozytorium
        uses: actions/checkout@v4

      - name: 2. Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Pobierz wszystkie pakiety (w tym te z GitHuba)
        run: npm install

      - name: 4. Zablokuj ponowne pobieranie pakietów przez Wispbyte
        run: |
          # Usuwamy dependencies z package.json po pobraniu node_modules.
          # Dzięki temu Wispbyte przy starcie nie wywoła błędu pobierania z GitHuba,
          # a wszystkie pakiety (w tym ts-node i typescript) są już fizycznie w node_modules!
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete pkg.dependencies;
            delete pkg.devDependencies;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          rm -f package-lock.json

      - name: 5. Włącz Cloudflare WARP (Ominięcie blokady IP GitHuba na Wispbyte)
        uses: Boostport/setup-cloudflare-warp@v1

      - name: 6. Prześlij całe repozytorium z node_modules przez SFTP (bez pakowania)
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          PORT: ${{ secrets.SFTP_PORT }}
          USER: ${{ secrets.SFTP_USER }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          
          cat << 'EOF' > sftp_commands.txt
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set mirror:use-pget-n 1
          open -u "$USER","$PASS" sftp://$HOST:$PORT
          mirror -R --parallel=10 --only-newer \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob docs/ \
            --exclude-glob sftp_commands.txt \
            --exclude-glob sftp_run.txt \
            ./ /
          bye
          EOF
          
          envsubst < sftp_commands.txt > sftp_run.txt
          lftp -f sftp_run.txt
